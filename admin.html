<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar catálogo | Winni Store</title><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><header><a href="/">← Volver a la tienda</a><strong>WINNI STORE · ADMIN</strong><button id="logout" hidden>Cerrar sesión</button></header><main><h1>Tu catálogo, al día.</h1><p id="notice" role="status" aria-live="polite"></p><form id="login"><h2>Acceso de administrador</h2><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar al panel</button></form><section id="dashboard" hidden><div class="toolbar"><p id="storage"></p><button id="new">+ Nuevo producto</button></div><div class="layout"><form id="editor"><h2 id="editor-title">Nuevo producto</h2><input id="product-id" type="hidden"><label>Nombre<input id="name" maxlength="180" required></label><label>Categoría<input id="category" list="categories" maxlength="80" required><datalist id="categories"></datalist></label><div class="columns"><label>Precio (S/)<input id="price" type="number" min="0.01" step="0.01" required></label><label>Precio anterior (opcional)<input id="old-price" type="number" min="0.01" step="0.01"></label></div><label>Descripción<textarea id="description" rows="6" maxlength="10000" required></textarea></label><label>Foto (JPG, PNG o WebP · máx. 3 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="hint">Sube una foto o indica una dirección HTTPS. Cada producto muestra una sola imagen.</p><label>Dirección de imagen<input id="image-url" maxlength="2000" placeholder="https://… o una foto subida"></label><img id="preview" alt="Vista previa del producto" hidden><label class="check"><input id="visible" type="checkbox" checked> Visible en la tienda</label><label class="check"><input id="featured" type="checkbox"> Destacado</label><div class="actions"><button id="save">Guardar producto</button><button type="button" id="cancel" class="secondary">Limpiar</button></div></form><section class="inventory"><h2>Productos del catálogo</h2><label>Buscar<input id="search-admin" type="search" placeholder="Nombre o categoría"></label><div id="list"></div></section></div></section></main><dialog id="delete-dialog"><h2>¿Eliminar este producto?</h2><p id="delete-name"></p><p>Se quitará del catálogo de la tienda.</p><div class="actions"><button id="confirm-delete" class="danger">Eliminar producto</button><button id="cancel-delete" class="secondary">Cancelar</button></div></dialog></body></html>
